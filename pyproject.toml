[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mre-mission-engineer"
version = "0.1.0"
description = "Evidence-to-next-test workbench for MRE ground experiments"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
mre = "mre_engineer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mre_engineer = ["resources/*.json", "schemas/*.json", "web/*.html", "web/*.css", "web/*.js", "web/amcharts/*.js", "web/*.xlsx"]
